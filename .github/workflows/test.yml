name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  sillytavern-import:
    runs-on: ubuntu-latest
    env:
      ST_VERSION: 1.19.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install SillyTavern ${{ env.ST_VERSION }}
        run: |
          git clone --depth 1 --branch "$ST_VERSION" https://github.com/SillyTavern/SillyTavern.git "$RUNNER_TEMP/st"
          cd "$RUNNER_TEMP/st" && npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run test:sillytavern
        env:
          ST_DIR: ${{ runner.temp }}/st
